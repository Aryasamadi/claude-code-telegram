name: Run Telegram Bot

on:
  workflow_dispatch:

# Keep this workflow read-only against the repository.
permissions:
  contents: read

# Never allow two polling instances of this bot to run at the same time.
concurrency:
  group: claude-code-telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs have a hard 6-hour execution limit.
    # Stop slightly earlier so the application can shut down cleanly.
    timeout-minutes: 350

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
      # Required application settings. The bot username is resolved from Telegram below.
      APPROVED_DIRECTORY: ${{ github.workspace }}
      DATABASE_URL: sqlite:///data/bot.db
      ENVIRONMENT: production
      DEVELOPMENT_MODE: "false"
      DEBUG: "false"
      LOG_LEVEL: INFO
      ENABLE_VOICE_MESSAGES: "false"

    steps:
      - name: Check required secrets
        shell: bash
        env:
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN}" ]]; then
            echo "::error::Add the TELEGRAM_BOT_TOKEN repository secret."
            exit 1
          fi

          if [[ -z "${ALLOWED_USERS}" ]]; then
            echo "::error::Add ALLOWED_USERS with your Telegram numeric user ID(s), comma-separated."
            exit 1
          fi

          python - <<'PY'
          import os
          users = [value.strip() for value in os.environ["ALLOWED_USERS"].split(",") if value.strip()]
          if not users:
              raise SystemExit("ALLOWED_USERS must contain at least one Telegram user ID.")
          try:
              [int(user) for user in users]
          except ValueError as exc:
              raise SystemExit("ALLOWED_USERS must contain numeric Telegram user IDs separated by commas.") from exc
          PY

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: |
          npm install --global @anthropic-ai/claude-code
          claude --version

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.3.3"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install bot dependencies
        run: |
          poetry check --lock
          poetry install --only main --no-interaction
          poetry run pip install "litellm[proxy]==1.106.0"

      - name: Resolve and validate Telegram bot username
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import urlopen

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          url = f"https://api.telegram.org/bot{token}/getMe"
          with urlopen(url, timeout=20) as response:
              result = json.load(response)

          if not result.get("ok") or not result.get("result", {}).get("username"):
              raise SystemExit("Telegram getMe validation failed. Check TELEGRAM_BOT_TOKEN.")

          username = result["result"]["username"]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"TELEGRAM_BOT_USERNAME={username}\n")

          print(f"Telegram bot token validated for @{username}.")
          PY

      - name: Prepare workspace and database
        run: |
          mkdir -p "$APPROVED_DIRECTORY" data

      - name: Start Telegram bot
        run: poetry run claude-telegram-bot
